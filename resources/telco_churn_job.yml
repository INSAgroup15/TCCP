resources:
  jobs:
    telco_churn_training:
      name: telco-churn-training-${bundle.target}
      tasks:
        - task_key: train_and_register
          environment_key: ml
          notebook_task:
            notebook_path: ../notebooks/02_model_training.ipynb
      environments:
        - environment_key: ml
          spec:
            environment_version: "2"
            dependencies:
              - "pandas>=2.0,<2.3"
              - "numpy==1.26.4"
              - "scikit-learn==1.9.0"
              - "matplotlib>=3.7"
              - "joblib>=1.3"
              - "xgboost>=2.0"
              - "torch>=2.2"
              - "mlflow==3.15.1"
              - "skops==0.14.0"
              - "pyarrow==16.1.0"
