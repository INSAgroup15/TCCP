resources:
  jobs:
    telco_churn_training:
      name: telco-churn-training-${bundle.target}
      tasks:
        - task_key: train_and_register
          environment_key: ml
          notebook_task:
            notebook_path: ../notebooks/02_model_training.ipynb
      environments:
        - environment_key: ml
          spec:
            environment_version: "2"
            dependencies:
              - "pandas>=2.0,<2.3"
              - "numpy>=1.24"
              - "scikit-learn>=1.3"
              - "matplotlib>=3.7"
              - "joblib>=1.3"
              - "shap>=0.44"
              - "xgboost>=2.0"
              - "torch>=2.2"
              - "mlflow>=2.12"
